<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Netflix U2-S6-L-5</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark text-white">
    <nav class="navbar navbar-expand-md bg-dark">
      <div>
        <img src="./img/netflix_logo.png" alt="logoN" width="100px" />
      </div>
    </nav>

    <section class="mt-5">
      <div class="container d-flex justify-content-center">
        <div class="">
          <p class="fs-1 border-bottom border-secondary-subtl">Edit Profile</p>
          <div class="row">
            <div class="col-6 col-md-3">
              <img src="img/avatar.png" alt="" width="100%" d-auto />
            </div>
            <div class="col-12 col-md-9">
              <p class="mb-4 mt-2 p-2 bg-secondary text-white fs-4">Strive Student</p>
              <p class="mb-1">Language:</p>
              <div class="border-bottom border-secondary-subtl">
                <button
                  class="btn btn-secondary btn-sm dropdown-toggle bg-black mb-3"
                  style="--bs-btn-padding-y: 0.25rem; --bs-btn-padding-x: 1.5rem; --bs-btn-font-size: 1rem"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  English
                </button>
              </div>
              <p class="mt-4 fs-4">Maturity Setting:</p>
              <p><a class="text-decoration-none text-white bg-secondary p-2" href="#">ALL MATURITY RATINGS</a></p>
              <p>Show titles of all maturity ratings for this profile.</p>
              <div class="border-bottom border-secondary-subtl">
                <button class="px-4 btn border border-secondary-subtle text-secondary mb-3">EDIT</button>
              </div>
              <p class="mt-4 fs-4">Autoplay Controls</p>

              <div class="row">
                <div class="col-1">
                  <label>
                    <input type="checkbox" />
                  </label>
                </div>
                <div class="col-11">
                  <p>Autoplay next episode in a series on all devices</p>
                </div>
              </div>
              <div class="row">
                <div class="col-1">
                  <label>
                    <input type="checkbox" />
                  </label>
                </div>
                <div class="col-11">
                  <p>Autoplay previews while browsing on all devices</p>
                </div>
              </div>

              <div class="border-top border-secondary-subtl">
                <button class="px-4 btn border border-secondary-subtle text-secondary mt-4 me-4">SAFE</button>
                <button class="px-4 btn border border-secondary-subtle text-secondary mt-4 me-4">CANCEL</button>
                <button class="px-4 btn border border-secondary-subtle text-secondary mt-4">DELETE PROFILE</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
